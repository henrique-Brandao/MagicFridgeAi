org: henriquefr321
app: magicfridgeai
service: magicfridgeai-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  memorySize: 512
  timeout: 30
  environment:
    API_KEY: ${env:API_KEY, ''}
    FOOD_TABLE: ${self:service}-${sls:stage}-food
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
          Resource:
            - Fn::GetAtt: [ FoodTable, Arn ]

package:
  artifact: deployment.zip

functions:
  api:
    handler: app.main.handler
    events:
      - httpApi: '*'

resources:
  Resources:
    FoodTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.FOOD_TABLE}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
